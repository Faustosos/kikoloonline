<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kikolo Online - Painel de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>Kikolo Online</h1>
        <p>Painel de Produtos Conectado</p>
    </div>

    <div id="produtos-container" class="container"></div>

    <script>
        const numeroWhatsapp = "244920000000"; // Mude para o seu número real se quiser

        async function carregarProdutos() {
            const container = document.getElementById("produtos-container");
            try {
                const resposta = await fetch("produtos.txt");
                if (!resposta.ok) throw new Error("Erro ao carregar");
                
                const texto = await resposta.text();
                const linhas = texto.split("\n");
                container.innerHTML = ""; 

                linhas.forEach(linha => {
                    if (linha.trim() === "") return;
                    const partes = linha.split("|");
                    
                    if (partes.length >= 2) {
                        const infoProduto = partes[0].trim();
                        const nomeImagem = partes[1].trim();

                        // Puxa a imagem diretamente da raiz do GitHub sem inventar extensões
                        let imageUrl = nomeImagem;

                        const mensagemWhats = encodeURIComponent(`Olá, tenho interesse no produto: ${infoProduto}`);
                        const linkWhats = `https://wa.me{numeroWhatsapp}?text=${mensagemWhats}`;

                        const divItem = document.createElement("div");
                        divItem.className = "produto-card"; 
                        divItem.innerHTML = `
                            <img src="${imageUrl}" alt="${infoProduto}" style="width:100%; max-height:250px; object-fit:contain; border-radius:12px;">
                            <div class="produto-info" style="padding:15px; text-align:center;">
                                <h2 style="font-size:1.2rem; margin-bottom:10px;">${infoProduto}</h2>
                                <a href="${linkWhats}" target="_blank" class="btn-whatsapp" style="display:inline-block; background-color:#25D366; color:white; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:bold;">
                                    🟢 Comprar via WhatsApp
                                </a>
                            </div>
                        `;
                        container.appendChild(divItem);
                    }
                });
            } catch (erro) {
                console.error(erro);
            }
        }
        document.addEventListener("DOMContentLoaded", carregarProdutos);
    </script>
</body>
</html>
