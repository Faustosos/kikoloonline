
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kikolo Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Kikolo Online</h1>
        <p>A sua vitrine digital rápida e segura</p>
    </header>

    <main>
        <h2>Nossos Produtos</h2>
        
        <!-- Produto 1 -->
        <div class="produto">
            <h3>Smartphone Samsung Galaxy</h3>
            <p>Preço: 150.000 Kz</p>
            <button onclick="adicionarAoCarrinho(150000)">Adicionar ao Carrinho</button>
        </div>
        <hr>

        <!-- Produto 2 -->
        <div class="produto">
            <h3>Ténis Desportivo</h3>
            <p>Preço: 35.000 Kz</p>
            <button onclick="adicionarAoCarrinho(350000)">Adicionar ao Carrinho</button>
        </div>
        <hr>

        <!-- Produto 3 -->
        <div class="produto">
            <h3>E-book: Como Vender Online</h3>
            <p>Preço: 5.000 Kz</p>
            <button onclick="adicionarAoCarrinho(5000)">Adicionar ao Carrinho</button>
        </div>

        <!-- Seção do Carrinho de Compras -->
        <div id="carrinho-resumo" style="background: #fff; padding: 15px; margin-top: 30px; border-radius: 8px; border: 2px dashed #0044cc; text-align: center;">
            <h3>🛒 Resumo do Pedido</h3>
            <p style="font-size: 18px; font-weight: bold;">Total acumulado: <span id="valor-total">0</span> Kz</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Kikolo Online - Todos os direitos reservados.</p>
    </footer>

    <!-- Código que faz a conta matemática do carrinho -->
    <script>
        let total = 0;
        function adicionarAoCarrinho(preco) {
            total = total + preco;
            document.getElementById('valor-total').innerText = total.toLocaleString('pt-AO');
            alert('Produto adicionado! Total atual: ' + total.toLocaleString('pt-AO') + ' Kz');
        }
    </script>
</body>
</html>
