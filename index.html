<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kikolo Online - Painel de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>Kikolo Online</h1>
        <p>Painel de Produtos Conectado</p>
    </div>

    <div id="produtos-container" class="container">
        <!-- Os produtos vão aparecer aqui automaticamente -->
    </div>

    <script>
        // Seu número de WhatsApp (mude se for necessário)
        const numeroWhatsapp = "244920000000"; 

        async function carregarProdutos() {
            const container = document.getElementById("produtos-container");
            
            try {
                // Busca o arquivo produtos.txt do seu GitHub
                const resposta = await fetch("produtos.txt");
                if (!resposta.ok) throw new Error("Erro ao carregar o arquivo produtos.txt");
                
                const texto = await resposta.text();
                // Divide o arquivo por linhas
                const linhas = texto.split("\n");

                container.innerHTML = ""; // Limpa o container antes de carregar

                linhas.forEach(linha => {
                    // Ignora linhas vazias
                    if (linha.trim() === "") return;

                    // Divide a linha pelas barras verticais "|"
                    const partes = linha.split("|");
                    
                    // Verifica se a linha tem as 3 partes necessárias (Nome, Preço, Imagem)
                    if (partes.length >= 3) {
                        const nomeProduto = partes[0].trim();
                        const precoProduto = partes[1].trim();
                        const nomeImagem = partes[2].trim();

                        // Define o caminho direto da imagem que está na raiz do seu GitHub
                        let imageUrl = nomeImagem;

                        // Se a imagem não for definida ou estiver vazia, usa uma imagem padrão
                        if (!imageUrl) {
                            imageUrl = "placeholder.jpg";
                        }

                        // Cria a mensagem para o WhatsApp do cliente
                        const mensagemWhats = encodeURIComponent(`Olá, tenho interesse no produto: ${nomeProduto} - ${precoProduto}`);
                        const linkWhats = `https://wa.me{numeroWhatsapp}?text=${mensagemWhats}`;

                        // Monta o bloco do produto em HTML com as classes do seu style.css
                        const divItem = document.createElement("div");
                        divItem.className = "produto-card"; // ajuste se o nome da classe no seu style.css for diferente
                        divItem.innerHTML = `
                            <img src="${imageUrl}" alt="${nomeProduto}" style="width:100%; max-height:250px; object-fit:contain; border-radius:12px;">
                            <div class="produto-info" style="padding:15px; text-align:center;">
                                <h2 style="font-size:1.2rem; margin-bottom:10px;">${nomeProduto} - ${precoProduto}</h2>
                                <a href="${linkWhats}" target="_blank" class="btn-whatsapp" style="display:inline-block; background-color:#25D366; color:white; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:bold;">
                                    🟢 Comprar via WhatsApp
                                </a>
                            </div>
                        `;
                        
                        container.appendChild(divItem);
                    }
                });

            } catch (erro) {
                console.error("Erro no processamento:", erro);
                container.innerHTML = "<p style='color:red; text-align:center;'>Erro ao carregar os produtos. Verifique o console.</p>";
            }
        }

        // Executa a função assim que a página termina de carregar
        document.addEventListener("DOMContentLoaded", carregarProdutos);
    </script>
</body>
</html>
