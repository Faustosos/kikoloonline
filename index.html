<div id="lista-produtos" style="max-width: 600px; margin: 20px auto; padding: 10px; font-family: sans-serif;">
    <!-- Os produtos vão aparecer aqui automaticamente -->
</div>

<script>
    const urlTxt = "https://githubusercontent.com";

    async function carregarProdutos() {
        try {
            const resposta = await fetch(urlTxt);
            const texto = await resposta.text();
            
            const linhas = texto.split('\n');
            const container = document.getElementById('lista-produtos');
            container.innerHTML = ""; 

            linhas.forEach(linha => {
                if(linha.trim() !== "") {
                    const partes = linha.split(' - ');
                    const nome = partes[0] ? partes[0].trim() : "Produto";
                    const preco = partes[1] ? partes[1].trim() : "Preço sob consulta";

                    container.innerHTML += `
                        <div style="background: #ffffff; margin-bottom: 15px; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-left: 5px solid #0057D9;">
                            <h3 style="margin: 0 0 8px 0; color: #333333; font-size: 18px;">${nome}</h3>
                            <strong style="color: #0057D9; font-size: 16px; display: block;">${preco}</strong>
                        </div>
                    `;
                }
            });
        } catch (erro) {
            console.error("Erro ao carregar produtos:", erro);
        }
    }

    carregarProdutos();
</script>
